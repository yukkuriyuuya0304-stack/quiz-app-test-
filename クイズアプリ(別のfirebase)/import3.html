    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLRWTz8HCrG4x41f4V-4S9_H8GKGOC-os",
            authDomain: "quiz-app-base-2test.firebaseapp.com",
            projectId: "quiz-app-base-2test",
            storageBucket: "quiz-app-base-2test.firebasestorage.app",
            messagingSenderId: "232545397427",
            appId: "1:232545397427:web:e75b2650481a6ea0899ec6",
            measurementId: "G-PRHYDR5WP0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('import-btn').addEventListener('click', async () => {
            const jsonText = document.getElementById('json-input').value.trim();
            const packName = document.getElementById('pack-name-input').value.trim() || "デフォルト";
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('import-btn');

            if (!jsonText) {
                statusEl.textContent = "データが入力されていません。";
                return;
            }

            try {
                const questions = JSON.parse(jsonText);
                if (!Array.isArray(questions)) throw new Error("データは配列（ [ ] ）で囲んでください。");

                btn.disabled = true;
                statusEl.style.color = "#007aff";
                
                let count = 0;
                for (const q of questions) {
                    q.packName = packName; // パック名を付与
                    await addDoc(collection(db, "questions"), q);
                    count++;
                    statusEl.textContent = `${questions.length}問中、${count}問目を登録中... (パック名: ${packName})`;
                }
                
                statusEl.style.color = "#34c759";
                statusEl.textContent = `完了しました！ ${count}問をパック「${packName}」として登録しました。`;
                document.getElementById('json-input').value = "";
            } catch (error) {
                console.error(error);
                statusEl.style.color = "#d9534f";
                statusEl.textContent = "エラー: データの形式が間違っています。（" + error.message + "）";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
